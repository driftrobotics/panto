<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>panto teleop</title>
<style>
  :root {
    --bg:#0d0f14; --panel:#161a22; --line:#262c38; --text:#e6e9ef; --muted:#8b93a3;
    --dot:#5064c8; --warn:#d4763a; --ok:#4ba36a; --bad:#b4453f;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height:100vh; height:100dvh; overflow:hidden;
    display:grid; grid-template-rows:auto 1fr; gap:8px; padding:10px 12px;
  }
  header { display:flex; align-items:baseline; gap:10px; }
  h1 { font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:600; margin:0; }
  #status { font-size:11px; color:var(--muted); }
  #status::before { content:"● "; }
  #status.live::before { color:var(--ok); } #status.dead::before { color:var(--bad); }
  .panel {
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px;
  }
  #main { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:10px; min-height:0; height:100%; }
  #left { display:flex; flex-direction:column; gap:8px; min-height:0; }
  #right { display:grid; grid-template-rows:auto auto auto 1fr; gap:8px; min-height:0; }
  #keys { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:6px 0 0; }
  .key {
    border:1px solid var(--line); border-radius:6px; padding:6px 10px;
    font-size:12px; color:var(--muted); min-width:52px; text-align:center;
  }
  .key.down { border-color:var(--dot); background:#1a1f33; color:var(--text); }
  .hint { color:var(--muted); font-size:11px; text-align:center; margin:0; }
  #estop {
    display:block; width:100%; padding:14px;
    background:var(--bad); color:#fff; border:none; border-radius:8px;
    font-size:16px; font-weight:700; letter-spacing:.05em; cursor:pointer;
  }
  #estop:hover { background:#c8534b; }
  #estop:active { background:#96322c; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:1px 8px; margin:0; font-size:11px; font-variant-numeric:tabular-nums; }
  dl.two-col { grid-template-columns:auto 1fr auto 1fr; }
  dt { color:var(--muted); } dd { margin:0; text-align:right; word-break:break-all; }
  #state-panel { overflow:auto; min-height:0; }
  #cams { display:flex; flex-direction:column; gap:8px; min-height:0; flex:1; }
  #cams figure { margin:0; display:flex; flex-direction:column; flex:1; min-height:0; }
  #cams video {
    width:100%; flex:1; min-height:0; aspect-ratio:4/3; object-fit:cover;
    background:#000; border:1px solid var(--line); border-radius:4px;
  }
  #cams figcaption { font-size:10px; color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; margin:4px 0; }
  .row label { flex:1; color:var(--muted); font-size:11px; }
  .row select, .row input { background:#0d0f14; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px 5px; font-size:12px; }
  .row input[type=number] { width:64px; }
  #map-apply {
    display:block; width:100%; padding:8px; margin-top:6px;
    background:var(--dot); color:#fff; border:none; border-radius:6px;
    font-size:12px; font-weight:600; cursor:pointer;
  }
  #map-current { font-size:11px; color:var(--muted); margin-top:6px; }
  #map-note { color:var(--muted); font-size:10px; text-align:center; margin:4px 0 0; }
  #map-error { color:var(--bad); font-size:10px; text-align:center; min-height:12px; }
  #mapping-panel h1, #keys-panel h1 { margin-bottom:2px; }
</style>
</head>
<body>
<header>
  <h1>panto teleop</h1>
  <div id="status" class="dead">connecting…</div>
</header>
<div id="main">
  <div id="left">
    <div id="cams">
      <figure><video id="cam-d405" autoplay muted playsinline></video><figcaption id="cap-d405">d405 (wrist) — connecting…</figcaption></figure>
      <figure><video id="cam-d435" autoplay muted playsinline></video><figcaption id="cap-d435">d435 — connecting…</figcaption></figure>
    </div>
  </div>
  <div id="right">
    <button id="estop">E-STOP</button>

    <div class="panel" id="keys-panel">
      <div class="hint">Space = grip · A/D = base rotate · ←/→ = EE in/out · ↑/↓ = EE z · C = clear nudge · Esc = E-STOP</div>
      <div id="keys">
        <div class="key" id="k-a">A ↺</div>
        <div class="key" id="k-d">D ↻</div>
        <div class="key" id="k-space">space</div>
        <div class="key" id="k-left">◀ in</div>
        <div class="key" id="k-right">out ▶</div>
        <div class="key" id="k-up">▲ z+</div>
        <div class="key" id="k-down">▼ z−</div>
        <div class="key" id="k-c">C ⌂</div>
      </div>
    </div>

    <div class="panel" id="mapping-panel">
      <h1>Mapping</h1>
      <div class="row">
        <label for="map-j0">panto j0 →</label>
        <select id="map-j0"></select>
        <label for="map-s0">×</label>
        <input id="map-s0" type="number" step="0.1" value="1">
      </div>
      <div class="row">
        <label for="map-j1">panto j1 →</label>
        <select id="map-j1"></select>
        <label for="map-s1">×</label>
        <input id="map-s1" type="number" step="0.1" value="1">
      </div>
      <button id="map-apply">Apply (re-engage)</button>
      <div id="map-note">Applying re-zeroes both arms at their current poses</div>
      <div id="map-current"></div>
      <div id="map-error"></div>
    </div>

    <div class="panel" id="state-panel">
      <dl id="state" class="two-col"></dl>
    </div>
  </div>
</div>

<script>
let ws = null;
const statusEl = document.getElementById('status');
const keyEls = Object.fromEntries(['space','a','d','left','right','up','down','c'].map(k => [k, document.getElementById('k-' + k)]));

function send(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }

const KEY_MAP = {
  ' ': 'space', 'Spacebar': 'space',
  'a': 'a', 'A': 'a', 'd': 'd', 'D': 'd', 'c': 'c', 'C': 'c',
  'ArrowLeft': 'left', 'ArrowRight': 'right', 'ArrowUp': 'up', 'ArrowDown': 'down',
};

function setKeyVisual(key, down) {
  const el = keyEls[key];
  if (el) el.classList.toggle('down', down);
}

const heldLocal = { space: false, left: false, right: false };

function sendKey(key, down) {
  if (heldLocal[key] === down) return;
  heldLocal[key] = down;
  setKeyVisual(key, down);
  send({ type: 'key', key, down });
}

function releaseAll() {
  for (const key of Object.keys(heldLocal)) sendKey(key, false);
  send({ type: 'blur' });
}

function isFormField(el) {
  return el && (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA');
}

document.addEventListener('keydown', e => {
  if (isFormField(e.target)) return;
  if (e.key === 'Escape') {
    send({ type: 'estop' });
    e.preventDefault();
    return;
  }
  const key = KEY_MAP[e.key];
  if (!key) return;
  e.preventDefault();
  if (e.repeat) return;
  sendKey(key, true);
});
document.addEventListener('keyup', e => {
  if (isFormField(e.target)) return;
  const key = KEY_MAP[e.key];
  if (!key) return;
  e.preventDefault();
  sendKey(key, false);
});
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

document.getElementById('estop').addEventListener('click', () => send({ type: 'estop' }));

/* ------------------------------------------------------------------ mapping panel */
const JOINT_NAMES = ['joint1', 'joint2', 'joint3', 'joint4', 'joint5', 'joint6', 'gripper'];
const selJ0 = document.getElementById('map-j0');
const selJ1 = document.getElementById('map-j1');
const inS0 = document.getElementById('map-s0');
const inS1 = document.getElementById('map-s1');
const mapCurrentEl = document.getElementById('map-current');
const mapErrorEl = document.getElementById('map-error');

for (const [i, name] of JOINT_NAMES.entries()) {
  const o0 = document.createElement('option'); o0.value = i; o0.textContent = name; selJ0.appendChild(o0);
  const o1 = document.createElement('option'); o1.value = i; o1.textContent = name; selJ1.appendChild(o1);
}
selJ0.value = 1; // joint2
selJ1.value = 2; // joint3

let mapDirty = false;
function markDirty() { mapDirty = true; }
[selJ0, selJ1, inS0, inS1].forEach(el => el.addEventListener('input', markDirty));
// Don't let a focused select/number input eat the teleop keys.
[selJ0, selJ1].forEach(el => el.addEventListener('change', () => el.blur()));

function blurMapInputs() {
  [selJ0, selJ1, inS0, inS1].forEach(el => el.blur());
}

function applyMap() {
  const joints = [parseInt(selJ0.value, 10), parseInt(selJ1.value, 10)];
  const scale = [parseFloat(inS0.value), parseFloat(inS1.value)];
  send({ type: 'map', joints, scale });
  mapDirty = false;
  blurMapInputs();
}
document.getElementById('map-apply').addEventListener('click', applyMap);

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') blurMapInputs();
}, true);

let mapErrorTimer = null;
function showMapError(message) {
  mapErrorEl.textContent = message;
  if (mapErrorTimer) clearTimeout(mapErrorTimer);
  mapErrorTimer = setTimeout(() => { mapErrorEl.textContent = ''; }, 4000);
}

function renderMap(map) {
  if (!map) return;
  const names = map.names || map.joints.map(i => JOINT_NAMES[i] || String(i));
  mapCurrentEl.textContent =
    `j0 → ${names[0]} ×${map.scale[0]}, j1 → ${names[1]} ×${map.scale[1]}`;
  if (mapDirty) return;
  selJ0.value = map.joints[0];
  selJ1.value = map.joints[1];
  inS0.value = map.scale[0];
  inS1.value = map.scale[1];
}

/* ------------------------------------------------------------------ state table */
function round3sf(x) {
  if (x === 0) return 0;
  const d = Math.ceil(Math.log10(Math.abs(x)));
  const power = 3 - d;
  const mag = Math.pow(10, power);
  return Math.round(x * mag) / mag;
}
function fmt(v) {
  if (typeof v === 'number') return String(round3sf(v));
  if (Array.isArray(v)) return v.map(x => (typeof x === 'number' ? round3sf(x) : x)).join(', ');
  if (v && typeof v === 'object') return JSON.stringify(v);
  return String(v);
}
function renderState(msg) {
  const dl = document.getElementById('state');
  dl.innerHTML = '';
  for (const [k, v] of Object.entries(msg)) {
    if (k === 'type' || k === 'map') continue;   // map is rendered by the Mapping panel
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = fmt(v);
    dl.appendChild(dt); dl.appendChild(dd);
  }
}

/* ------------------------------------------------------------------ transport */
let backoffMs = 500;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => {
    statusEl.textContent = 'connected';
    statusEl.className = 'live';
    backoffMs = 500;
  };
  ws.onclose = () => {
    statusEl.textContent = 'disconnected — retrying';
    statusEl.className = 'dead';
    setTimeout(connect, backoffMs);
    backoffMs = Math.min(backoffMs * 2, 8000);
  };
  ws.onerror = () => { ws.close(); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === 'state') {
      renderState(m);
      if (m.map) renderMap(m.map);
    } else if (m.type === 'error') {
      showMapError(m.message);
    }
  };
}
connect();

// --- cameras: mediamtx WebRTC (WHEP) on port 8889, same host as this page ---
async function whep(name) {
  const video = document.getElementById('cam-' + name), cap = document.getElementById('cap-' + name);
  const url = `${location.protocol}//${location.hostname}:8889/${name}/whep`;
  let delay = 1000;
  for (;;) {
    let pc;
    try {
      pc = new RTCPeerConnection();
      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.ontrack = (ev) => { video.srcObject = ev.streams[0]; cap.textContent = name + (name === 'd405' ? ' (wrist)' : ''); };
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await new Promise((r) => { if (pc.iceGatheringState === 'complete') r(); else pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && r(); setTimeout(r, 500); });
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp });
      if (!res.ok) throw new Error('whep ' + res.status);
      await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
      delay = 1000;
      await new Promise((r) => { pc.onconnectionstatechange = () => ['failed', 'disconnected', 'closed'].includes(pc.connectionState) && r(); });
    } catch (e) {
      cap.textContent = name + ' — ' + (e.message || e) + ' (retrying)';
    }
    try { pc && pc.close(); } catch (_) {}
    await new Promise((r) => setTimeout(r, delay));
    delay = Math.min(delay * 2, 8000);
  }
}
whep('d405'); whep('d435');
</script>
</body>
</html>
