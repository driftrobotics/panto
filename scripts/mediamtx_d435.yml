# Minimal mediamtx config for the D435 RTSP publisher.
# Only RTSP is needed; disable the other protocols mediamtx enables by default
# to keep this lightweight and avoid port clashes on a shared box.
rtspAddress: :8554
rtpAddress: :8000
rtcpAddress: :8001
webrtcAddress: :8889
hlsAddress: :8888
srtAddress: :8890

api: no
metrics: no
pprof: no
webrtc: no
hls: no
srt: no
rtmp: no
moq: no

logLevel: info
logDestinations: [stdout]

paths:
  d435:
    source: publisher
